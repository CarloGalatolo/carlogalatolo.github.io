<!DOCTYPE html>
<html lang="it">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>YGO Link Grid - Un minigioco alternativo</title>
	<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<link rel="stylesheet" href="style.css">

<body>

<div class="wrap">
  <header class="top">
    <h1>YGO Link Grid</h1>
    <span class="spacer"></span>
    <button class="btn" id="btnExit" hidden>Torna al menu</button>
  </header>

  <main id="menu">
    <div class="menu">
      <section>
		<h2>Su questo dispositivo</h2>
		<p>Due giocatori a turno sullo stesso schermo.</p>
		<div class="row"><label for="ld0">Giocatore 1</label><select id="ld0"></select></div>
		<div class="row"><label for="ld1">Giocatore 2</label><select id="ld1"></select></div>
		<div class="row"><label style="min-width:0"><input type="checkbox" id="faceOpt"> Carte rivolte verso chi le controlla</label></div>
		<button class="btn primary" id="btnLocal">Inizia la partita</button>
      </section>
      <section>
		<h2>Online, in una stanza</h2>
		<p>Crea una stanza e dai il codice all’altro giocatore, oppure entra con il suo codice. Funziona da qualsiasi browser.</p>
		<div class="row"><label for="od">Il tuo mazzo</label><select id="od"></select></div>
		<div class="row"><button class="btn primary" id="btnCreate" disabled>Crea una stanza</button></div>
		<div class="row"><input type="text" id="joinCode" maxlength="5" placeholder="CODICE" aria-label="Codice della stanza" autocomplete="off"><button class="btn" id="btnJoin" disabled>Entra</button></div>
		<div class="note" id="onlineNote">Controllo della connessione…</div>
		<div class="err" id="menuErr" hidden></div>
		<div class="note resume" id="resumeBox" hidden></div>
      </section>
	</div>
	<div class="rulesrow">
		<div class="box rules" id="rulesMenu"></div>
		<div class="box rules" id="rulesSetup"></div>
	</div>
	<div class="decklist" id="deckPreview"></div>
  </main>

  <main id="game" class="game" hidden>
    <div class="box" id="statusBox" aria-live="polite"><div class="status" id="status"></div></div>
    <section class="table" aria-label="Tavolo">
      <div class="pinfo" id="infoTop"></div>
      <div class="hand topside" id="handTop"></div>
      <div class="board" id="board" role="grid" aria-label="Griglia 5 per 5"></div>
      <div class="hand bottom" id="handBottom"></div>
      <div class="pinfo" id="infoBottom"></div>
    </section>
    <aside class="panel">
      <div class="box" id="extraBox" hidden></div>
      <div class="box" id="inspBox"><h3>Carta selezionata</h3><div id="insp" class="insp-stack"></div></div>
      <div class="tools" id="tools"></div>
      <div class="box rules" id="rulesGame"></div>
      <div class="box"><h3>Registro</h3><ol class="log" id="log"></ol></div>
    </aside>
  </main>
  
</div>
<script src="engine.js"></script>
<script src="net.js"></script>
<script src="graphics.js"></script>
</body>
</html>
